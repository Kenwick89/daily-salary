<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日薪記帳 💰</title>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:10px; background:#f5f5f5;}
.container { max-width: 100%; margin:auto; background:white; padding:10px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
h1 { text-align:center; font-size:20px; margin-bottom:5px; }
.salary-input { text-align:center; margin-bottom:5px; }
.weekdays { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-weight:bold; margin-bottom:2px; font-size:12px; }
#calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; width:100%; }
.day {
  width: 100%; min-height:70px; display:flex; flex-direction:column; justify-content:flex-start; align-items:center; font-size:12px;
  border-radius:5px; background:#eee; position:relative; cursor:pointer; padding-top:5px; box-sizing:border-box;
}
.day span.date { font-weight:bold; font-size:14px; }
.day .note { font-size:10px; text-align:center; margin-top:2px; word-break:break-word;}
.day.today { background:#ff9800; color:#fff; }
.day.worked { background:#4caf50; color:#fff; }
.day.halfday { background:#FFF176; color:#000; } /* 半天淺黃 */
.day.bonus { background:#F44336; color:#fff; } /* 分紅紅色 */
.day button { padding:2px 5px; font-size:10px; border:none; border-radius:3px; background:#2196f3; color:white; cursor:pointer; margin-top:2px; z-index:1; }
.day button:hover { background:#1976d2; }
.summary { margin-top:10px; font-size:14px; }
button#exportCSV, button#prevMonth, button#nextMonth { padding:5px 10px; border:none; border-radius:5px; background:#2196f3; color:white; cursor:pointer; font-size:14px; }
button#exportCSV:hover, button#prevMonth:hover, button#nextMonth:hover { background:#1976d2; }
input#dailySalary { width:60px; font-size:14px; }
.calendar-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; font-size:14px; }
#holidayList { text-align:center; margin-bottom:5px; font-size:12px; word-break:break-word; color:#d32f2f; font-weight:bold;}
</style>
</head>
<body>
<div class="container">
<h1>日薪記帳 💰</h1>
<div class="salary-input">每日薪資: <input type="number" id="dailySalary" value="1700"> TWD</div>
<div class="calendar-nav">
<button id="prevMonth">‹ 上月</button>
<span id="monthYear"></span>
<button id="nextMonth">下月 ›</button>
</div>
<div id="holidayList"></div>
<div class="weekdays">
<div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
</div>
<div id="calendar"></div>
<div class="summary">
<p>本月工作天數：<span id="monthWorked">0</span> 天</p>
<p>本月收入：<span id="monthIncome">0</span> TWD</p>
<p>累計工作天數：<span id="totalWorked">0</span> 天</p>
<p>累計收入：<span id="totalIncome">0</span> TWD</p>
<button id="exportCSV">匯出 CSV</button>
</div>
</div>

<script>
const lunarNewYearDays = {
  2025: [
    {date:"2025-01-28", name:"除夕"},
    {date:"2025-01-29", name:"春節初一"},
    {date:"2025-01-30", name:"春節初二"},
    {date:"2025-01-31", name:"春節初三"}
  ]
};

function getTaiwanHolidays(year){
  const lunarDays = lunarNewYearDays[year] || [];
  const holidays = {
    [`${year}-01-01`]:"元旦",
    [`${year}-02-28`]:"和平紀念日",
    [`${year}-04-04`]:"兒童節",
    [`${year}-04-05`]:"清明節",
    [`${year}-06-25`]:"端午節",
    [`${year}-10-10`]:"國慶日",
    [`${year}-02-14`]:"情人節",
    [`${year}-03-08`]:"婦女節",
    [`${year}-05-01`]:"勞動節",
    [`${year}-05-10`]:"母親節",
    [`${year}-08-08`]:"父親節",
    [`${year}-09-03`]:"軍人節",
    [`${year}-09-29`]:"中秋節",
    [`${year}-10-31`]:"萬聖節",
    [`${year}-11-11`]:"雙十一",
    [`${year}-12-25`]:"聖誕節"
  };
  lunarDays.forEach(d => { holidays[d.date]=d.name; });
  return holidays;
}

const calendarEl = document.getElementById('calendar');
const monthYearEl = document.getElementById('monthYear');
const holidayListEl = document.getElementById('holidayList');
const dailySalaryInput = document.getElementById('dailySalary');
const monthWorkedEl = document.getElementById('monthWorked');
const monthIncomeEl = document.getElementById('monthIncome');
const totalWorkedEl = document.getElementById('totalWorked');
const totalIncomeEl = document.getElementById('totalIncome');
const exportCSVBtn = document.getElementById('exportCSV');
const prevMonthBtn = document.getElementById('prevMonth');
const nextMonthBtn = document.getElementById('nextMonth');

let currentDate = new Date();
let dailySalary = Number(dailySalaryInput.value);
let workedDays = JSON.parse(localStorage.getItem('workedDays')||'{}');

function saveData(){ localStorage.setItem('workedDays', JSON.stringify(workedDays)); }
function formatDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function renderHolidayList(){
  const monthHolidays = [];
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth() + 1;
  const taiwanHolidays = getTaiwanHolidays(year);
  for(let dateStr in taiwanHolidays){
    if(dateStr.startsWith(`${year}-${String(month).padStart(2,'0')}`)){
      monthHolidays.push(`${dateStr.split('-')[2]}日 ${taiwanHolidays[dateStr]}`);
    }
  }
  holidayListEl.textContent = monthHolidays.join(' | ');
}

function renderCalendar(){
  calendarEl.innerHTML='';
  let year=currentDate.getFullYear();
  let month=currentDate.getMonth();
  monthYearEl.textContent=`${year} 年 ${month+1} 月`;
  renderHolidayList();

  const taiwanHolidays = getTaiwanHolidays(year);

  let firstDay=new Date(year,month,1).getDay();
  let lastDate=new Date(year,month+1,0).getDate();

  for(let i=0;i<firstDay;i++){
    let blank=document.createElement('div');
    blank.className='day';
    blank.style.visibility='hidden';
    calendarEl.appendChild(blank);
  }

  for(let d=1; d<=lastDate; d++){
    let date=new Date(year,month,d);
    let dateStr=formatDate(date);
    let dayEl=document.createElement('div');
    dayEl.className='day';

    let dateSpan=document.createElement('span');
    dateSpan.className='date';
    dateSpan.textContent=d;
    dayEl.appendChild(dateSpan);

    // 節日
    if(taiwanHolidays[dateStr]){
      let holidayDiv=document.createElement('div');
      holidayDiv.className='note';
      holidayDiv.textContent=taiwanHolidays[dateStr];
      holidayDiv.style.color="#d32f2f";
      holidayDiv.style.fontWeight='bold';
      dayEl.appendChild(holidayDiv);
      // 節日紅底自動文字白色後續判斷
    }

    // 備註
    let noteDiv=document.createElement('div');
    noteDiv.className='note';
    noteDiv.textContent=(workedDays[dateStr] && workedDays[dateStr].note)||'';
    dayEl.appendChild(noteDiv);

    // 格子點擊切換出勤
    dayEl.onclick=()=>{
      let currentData=workedDays[dateStr]||{salary:dailySalary,note:"",done:false,type:null};
      currentData.done=!currentData.done;
      if(currentData.done) currentData.salary=dailySalary;
      else { currentData.salary=0; currentData.note=''; currentData.type=null; }
      workedDays[dateStr]=currentData;
      saveData();
      renderCalendar();
    };

    // 修改薪資
    let editBtn=document.createElement('button');
    editBtn.textContent='修改';
    editBtn.onclick=(e)=>{
      e.stopPropagation();
      let currentData=workedDays[dateStr]||{salary:dailySalary,note:"",done:true,type:null};
      let salaryInput=prompt("請輸入當天薪資（0 表示取消出勤）",currentData.salary);
      if(salaryInput===null) return;
      currentData.salary=Number(salaryInput);
      currentData.done=currentData.salary>0;

      // 跳出備註選擇
      let choice = prompt("輸入備註類型: 1=半天, 2=分紅, 其他=無");
      if(choice==='1'){ currentData.note='半天'; currentData.type='halfday'; }
      else if(choice==='2'){ currentData.note='分紅'; currentData.type='bonus'; }
      else{ currentData.note=''; currentData.type=null; }

      workedDays[dateStr]=currentData;
      saveData();
      renderCalendar();
    };
    dayEl.appendChild(editBtn);

    // 更新格子顏色
    if(workedDays[dateStr]){
      if(workedDays[dateStr].type==='halfday') dayEl.classList.add('halfday');
      else if(workedDays[dateStr].type==='bonus') dayEl.classList.add('bonus');
      else if(workedDays[dateStr].done) dayEl.classList.add('worked');
    }

    // 節日紅底文字自動白色
    let bgColor = window.getComputedStyle(dayEl).backgroundColor;
    if(taiwanHolidays[dateStr] || bgColor.includes("rgb(244, 67, 54)")){ 
      dayEl.style.color="#fff";
    }

    calendarEl.appendChild(dayEl);
  }
  updateSummary();
}

function updateSummary(){
  let monthWorked=0, monthIncome=0, totalWorked=0, totalIncome=0;
  for(let key in workedDays){
    if(workedDays[key].done){
      totalWorked++;
      totalIncome+=workedDays[key].salary;
      let d = new Date(key);
      if(d.getFullYear()===currentDate.getFullYear() && d.getMonth()===currentDate.getMonth()){
        monthWorked++;
        monthIncome+=workedDays[key].salary;
      }
    }
  }
  monthWorkedEl.textContent=monthWorked;
  monthIncomeEl.textContent=monthIncome;
  totalWorkedEl.textContent=totalWorked;
  totalIncomeEl.textContent=totalIncome;
}

dailySalaryInput.onchange=()=>{ dailySalary=Number(dailySalaryInput.value); renderCalendar(); }
prevMonthBtn.onclick=()=>{ currentDate.setMonth(currentDate.getMonth()-1); renderCalendar(); }
nextMonthBtn.onclick=()=>{ currentDate.setMonth(currentDate.getMonth()+1); renderCalendar(); }
exportCSVBtn.onclick=()=>{
  let csv="日期,薪資,備註\n";
  for(let key in workedDays){
    let w=workedDays[key];
    csv+=`${key},${w.salary},${w.note}\n`;
  }
  let blob=new Blob([csv],{type:"text/csv"});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download="salary_record.csv";
  a.click();
}

renderCalendar();
</script>
</body>
</html>
