<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>日薪記帳 💰</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #f5f5f5; margin:0; padding:0; }
.container { max-width: 100%; margin: 10px auto; background:white; padding:10px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
h1 { text-align:center; font-size:18px; margin-bottom:5px; }
.salary-input { margin-bottom: 5px; text-align:center; font-size:14px; }
.calendar-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; font-size:14px; }
.weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; margin-bottom: 2px; font-size:12px; }
#calendar { display:grid; grid-template-columns: repeat(7, 1fr); gap:2px; width:100%; }
.day { width:100%; aspect-ratio:1/1; display:flex; flex-direction: column; justify-content: flex-start; align-items: center; font-size:12px; border-radius:5px; background:#eee; cursor:pointer; position: relative; }
.day span.date { font-weight:bold; margin-bottom:2px; font-size:14px; }
.day .note { font-size:10px; margin-top:2px; word-break: break-word; text-align:center; }
.day.today { background:#ff9800; color:#fff; }
.day.worked { background:#4caf50; color:#fff; }
.day.special { background:#f44336; color:#fff; }
.day button { padding:2px 5px; font-size:10px; border:none; border-radius:3px; background:#2196f3; color:white; cursor:pointer; margin-top:2px; }
.day button:hover { background:#1976d2; }
.summary { margin-top:10px; font-size:14px; }
button#exportCSV, button#prevMonth, button#nextMonth { padding:5px 10px; border:none; border-radius:5px; background:#2196f3; color:white; cursor:pointer; font-size:14px; }
button#exportCSV:hover, button#prevMonth:hover, button#nextMonth:hover { background:#1976d2; }
input#dailySalary { width:60px; font-size:14px; }
</style>
</head>
<body>
<div class="container">
<h1>日薪記帳 💰</h1>
<div class="salary-input">
每日薪資: <input type="number" id="dailySalary" value="1700"> TWD
</div>
<div class="calendar-nav">
<button id="prevMonth">‹ 上月</button>
<span id="monthYear"></span>
<button id="nextMonth">下月 ›</button>
</div>
<div class="weekdays">
<div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
</div>
<div id="calendar-container">
<div id="calendar"></div>
</div>
<div class="summary">
<p>本月工作天數：<span id="monthWorked">0</span> 天</p>
<p>本月收入：<span id="monthIncome">0</span> TWD</p>
<p>累計工作天數：<span id="totalWorked">0</span> 天</p>
<p>累計收入：<span id="totalIncome">0</span> TWD</p>
<button id="exportCSV">匯出 CSV</button>
</div>
</div>

<script>
const calendarEl = document.getElementById('calendar');
const monthYearEl = document.getElementById('monthYear');
const dailySalaryInput = document.getElementById('dailySalary');
const monthWorkedEl = document.getElementById('monthWorked');
const monthIncomeEl = document.getElementById('monthIncome');
const totalWorkedEl = document.getElementById('totalWorked');
const totalIncomeEl = document.getElementById('totalIncome');
const exportCSVBtn = document.getElementById('exportCSV');
const prevMonthBtn = document.getElementById('prevMonth');
const nextMonthBtn = document.getElementById('nextMonth');

let currentDate = new Date();
let dailySalary = Number(dailySalaryInput.value);
let workedDays = JSON.parse(localStorage.getItem('workedDays')||'{}');

function saveData(){ localStorage.setItem('workedDays', JSON.stringify(workedDays)); }
function formatDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function renderCalendar(){
calendarEl.innerHTML='';
let year = currentDate.getFullYear();
let month = currentDate.getMonth();
monthYearEl.textContent = `${year} 年 ${month+1} 月`;

let firstDay = new Date(year, month, 1);
let lastDay = new Date(year, month+1, 0);

// 空白格
for(let i=0;i<firstDay.getDay();i++){
let blank=document.createElement('div');
blank.className='day';
blank.style.visibility='hidden';
calendarEl.appendChild(blank);
}

// 日期格
for(let d=1; d<=lastDay.getDate(); d++){
let date=new Date(year,month,d);
let dateStr=formatDate(date);
let dayEl=document.createElement('div');
dayEl.className='day';

let dateSpan=document.createElement('span');
dateSpan.className='date';
dateSpan.textContent=d;
dayEl.appendChild(dateSpan);

let noteDiv=document.createElement('div');
noteDiv.className='note';
noteDiv.textContent=(workedDays[dateStr]&&workedDays[dateStr].note)||'';
dayEl.appendChild(noteDiv);

let today=new Date();
if(date.getFullYear()===today.getFullYear()&&date.getMonth()===today.getMonth()&&date.getDate()===today.getDate()){
dayEl.classList.add('today');
}

if(workedDays[dateStr] && workedDays[dateStr].done){
if(workedDays[dateStr].salary!==dailySalary){
dayEl.classList.add('special');
}else{
dayEl.classList.add('worked');
}
}

dayEl.onclick=()=>{
let currentData=workedDays[dateStr]||{salary:dailySalary,note:"",done:false};
currentData.done=!currentData.done;
if(currentData.done && currentData.salary===0) currentData.salary=dailySalary;
workedDays[dateStr]=currentData;
saveData();
renderCalendar();
};

let editBtn=document.createElement('button');
editBtn.textContent="修改";
editBtn.onclick=(e)=>{
e.stopPropagation();
let currentData=workedDays[dateStr]||{salary:dailySalary,note:"",done:false};
let salaryInput=prompt("請輸入當天薪資（0 表示取消出勤）:",currentData.salary);
if(salaryInput===null) return;
let salaryValue=Number(salaryInput);
let noteInput=prompt("請輸入備註（可留空）:",currentData.note||"");
if(salaryValue>0){
workedDays[dateStr]={salary:salaryValue,note:noteInput,done:true};
}else{
workedDays[dateStr]={salary:salaryValue,note:noteInput,done:false};
}
saveData();
renderCalendar();
};
dayEl.appendChild(editBtn);
calendarEl.appendChild(dayEl);
}

// 統計
let monthIncome=0,monthCount=0,totalWorkedCount=0,totalIncomeSum=0;
for(let key in workedDays){
let data=workedDays[key];
let d=new Date(key);
if(data.done){
totalIncomeSum+=data.salary;
totalWorkedCount++;
if(d.getFullYear()===year && d.getMonth()===month){
monthIncome+=data.salary;
monthCount++;
}
}
}
monthWorkedEl.textContent=monthCount;
monthIncomeEl.textContent=monthIncome;
totalWorkedEl.textContent=totalWorkedCount;
totalIncomeEl.textContent=totalIncomeSum;
}

dailySalaryInput.addEventListener('change',()=>{
dailySalary=Number(dailySalaryInput.value);
renderCalendar();
});
prevMonthBtn.onclick=()=>{currentDate.setMonth(currentDate.getMonth()-1);renderCalendar();};
nextMonthBtn.onclick=()=>{currentDate.setMonth(currentDate.getMonth()+1);renderCalendar();};
exportCSVBtn.onclick=()=>{
let csv='date,salary,note,done\n';
for(let key in workedDays){
let data=workedDays[key];
csv+=`${key},${data.salary},${data.note||''},${data.done?'Y':'N'}\n`;
}
let blob=new Blob([csv],{type:'text/csv'});
let url=URL.createObjectURL(blob);
let a=document.createElement('a');
a.href=url;
a.download='workdays.csv';
a.click();
URL.revokeObjectURL(url);
};

renderCalendar();
</script>
</body>
</html>
